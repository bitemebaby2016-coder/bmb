        env:
          DISPATCH_URL: https://ivkdfognyiwjcmrhcnwz.supabase.co/functions/v1/queue-dispatcher
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          RESP=$(curl -sS -f -X POST "$DISPATCH_URL" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_Q7AHrjSYOrysDjxS9_ZB-g_NMmytLOH" \
            -H "x-automation-token: $TOKEN" \
            -d "{\"jobType\":\"inventory_low_stock\"}") || {
            echo "::error::inventory_low_stock dispatcher HTTP failed"; exit 1; }
          echo "$RESP" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { const j=JSON.parse(s);
                const bad=(j.results||[]).filter(r=>r.queueResult!=="SUCCEEDED");
                if (bad.length) { console.error("::error::inventory_low_stock queue results not all SUCCEEDED: " + JSON.stringify(bad)); process.exit(1); }
                console.log("inventory_low_stock claimed=" + j.claimed + " all SUCCEEDED");
              } catch(e) { console.error("::error::invalid dispatcher response"); process.exit(1); }
            })'