# ============================================
# BMB — automation-scheduler (G8-S5 CUTOVER)
#
# SINGLE-PATH queue architecture (Owner-authorized G8-S5):
#   GitHub Actions (this workflow)
#     → queue-enqueue  (secure enqueue transport: verify_jwt + x-automation-token,
#                       allowlisted jobs, server-side payload templates, DB idempotency)
#     → automation_queue (deterministic identity 'sched-<job>-<ref>')
#     → queue-dispatcher (atomic claim FOR UPDATE SKIP LOCKED → canonical worker
#                         automation-worker UNCHANGED → complete/fail RPC)
#
# LEGACY DIRECT WORKER INVOCATION REMOVED in this commit (single-commit toggle).
# No dual path: each schedule event = ONE enqueue + ONE dispatch.
#
# Identity: ref gh-dispatch-YYYYMMDDTHHMM / gh-stale-YYYYMMDDTHHMM / gh-stock-YYYYMMDDTHH
# (same cadence granularity as the legacy eventId scheme).
#
# Failure behavior: the step FAILS if enqueue result is neither ENQUEUED nor
# DUPLICATE, or any dispatch result is not queue-final 'SUCCEEDED' — visible in
# Actions history. Token is never echoed.
# G6/G7 remain NOT REGISTERED (separate gate).
# ============================================

name: automation-scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (all | dispatch | stale | stock)'
        required: false
        default: 'all'

concurrency:
  group: bmb-automation
  cancel-in-progress: false

permissions: {}

jobs:
  every-5-minutes:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'dispatch' || github.event.inputs.job == 'stale')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: notification_dispatch_enqueue
        env:
          ENQUEUE_URL: https://ivkdfognyiwjcmrhcnwz.supabase.co/functions/v1/queue-enqueue
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          EV="gh-dispatch-$(date -u +%Y%m%dT%H%M)"
          RESP=$(curl -sS -f -X POST "$ENQUEUE_URL" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_Q7AHrjSYOrysDjxS9_ZB-g_NMmytLOH" \
            -H "x-automation-token: $TOKEN" \
            -d "{\"job\":\"notification_dispatch\",\"ref\":\"$EV\",\"params\":{\"lookbackMinutes\":360,\"limit\":200}}") || {
            echo "::error::notification_dispatch enqueue HTTP failed"; exit 1; }
          echo "$RESP" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { const j=JSON.parse(s);
                if (j.result !== "ENQUEUED" && j.result !== "DUPLICATE") {
                  console.error("::error::notification_dispatch enqueue result=" + (j.result || j.error)); process.exit(1);
                }
                console.log("notification_dispatch enqueue " + j.result + " id=" + j.id);
              } catch(e) { console.error("::error::invalid enqueue response"); process.exit(1); }
            })'
      - name: notification_dispatch_dispatch
        if: always()
        needs: notification_dispatch_enqueue
        env:
          DISPATCH_URL: https://ivkdfognyiwjcmrhcnwz.supabase.co/functions/v1/queue-dispatcher
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          RESP=$(curl -sS -f -X POST "$DISPATCH_URL" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_Q7AHrjSYOrysDjxS9_ZB-g_NMmytLOH" \
            -H "x-automation-token: $TOKEN" \
            -d "{\"jobType\":\"notification_dispatch\"}") || {
            echo "::error::notification_dispatch dispatcher HTTP failed"; exit 1; }
          echo "$RESP" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { const j=JSON.parse(s);
                const bad=(j.results||[]).filter(r=>r.queueResult!=="SUCCEEDED");
                if (bad.length) { console.error("::error::notification_dispatch queue results not all SUCCEEDED: " + JSON.stringify(bad)); process.exit(1); }
                console.log("notification_dispatch claimed=" + j.claimed + " all SUCCEEDED");
              } catch(e) { console.error("::error::invalid dispatcher response"); process.exit(1); }
            })'
      - name: orders_stale_pending_enqueue
        env:
          ENQUEUE_URL: https://ivkdfognyiwjcmrhcnwz.supabase.co/functions/v1/queue-enqueue
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          EV="gh-stale-$(date -u +%Y%m%dT%H%M)"
          RESP=$(curl -sS -f -X POST "$ENQUEUE_URL" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_Q7AHrjSYOrysDjxS9_ZB-g_NMmytLOH" \
            -H "x-automation-token: $TOKEN" \
            -d "{\"job\":\"orders_stale_pending\",\"ref\":\"$EV\",\"params\":{\"maxAgeMinutes\":120}}") || {
            echo "::error::orders_stale_pending enqueue HTTP failed"; exit 1; }
          echo "$RESP" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { const j=JSON.parse(s);
                if (j.result !== "ENQUEUED" && j.result !== "DUPLICATE") {
                  console.error("::error::orders_stale_pending enqueue result=" + (j.result || j.error)); process.exit(1);
                }
                console.log("orders_stale_pending enqueue " + j.result + " id=" + j.id);
              } catch(e) { console.error("::error::invalid enqueue response"); process.exit(1); }
            })'
      - name: orders_stale_pending_dispatch
        if: always()
        needs: orders_stale_pending_enqueue
        env:
          DISPATCH_URL: https://ivkdfognyiwjcmrhcnwz.supabase.co/functions/v1/queue-dispatcher
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          RESP=$(curl -sS -f -X POST "$DISPATCH_URL" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_Q7AHrjSYOrysDjxS9_ZB-g_NMmytLOH" \
            -H "x-automation-token: $TOKEN" \
            -d "{\"jobType\":\"orders_stale_pending\"}") || {
            echo "::error::orders_stale_pending dispatcher HTTP failed"; exit 1; }
          echo "$RESP" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { const j=JSON.parse(s);
                const bad=(j.results||[]).filter(r=>r.queueResult!=="SUCCEEDED");
                if (bad.length) { console.error("::error::orders_stale_pending queue results not all SUCCEEDED: " + JSON.stringify(bad)); process.exit(1); }
                console.log("orders_stale_pending claimed=" + j.claimed + " all SUCCEEDED");
              } catch(e) { console.error("::error::invalid dispatcher response"); process.exit(1); }
            })'

  hourly-low-stock:
    if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'stock'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: inventory_low_stock_enqueue
        env:
          ENQUEUE_URL: https://ivkdfognyiwjcmrhcnwz.supabase.co/functions/v1/queue-enqueue
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          EV="gh-stock-$(date -u +%Y%m%dT%H)"
          RESP=$(curl -sS -f -X POST "$ENQUEUE_URL" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_Q7AHrjSYOrysDjxS9_ZB-g_NMmytLOH" \
            -H "x-automation-token: $TOKEN" \
            -d "{\"job\":\"inventory_low_stock\",\"ref\":\"$EV\",\"params\":{\"stockThreshold\":3}}") || {
