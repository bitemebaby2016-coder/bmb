# ISOLATED SQL contract tests — ephemeral PostgreSQL service (CI only).
# แยกจาก ci.yml (production build path) อย่างเด็ดขาด: ไม่มี production
# credentials, ไม่มี supabase URL fallback, DB หายไปพร้อม job ทุกครั้ง
name: Contract Tests (isolated PostgreSQL)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sql-contracts:
    name: Migrations + SQL contracts (ephemeral PG)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bmb_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bmb_contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Prelude — Supabase stubs (roles/auth/storage)
        run: psql -v ON_ERROR_STOP=1 -f e2e/ci/00_prelude_supabase_stubs.sql

      - name: Apply migrations 001-123 (inventory mode — collect ALL failures)
        run: |
          set +e   # GitHub รันด้วย bash -e — inventory mode ต้องจัดการ exit เอง
          set -uo pipefail
          # preprocessor: แก้เฉพาะ TEMP COPY (ไฟล์ history ไม่ถูกแตะ)
          # 1) '}' ที่ใช้แทน dollar-quote ใน 035 (4 บรรทัด, manual-apply era)
          # 2) แทรก DROP POLICY IF EXISTS ก่อนทุก CREATE POLICY ที่อยู่นอก
          #    dollar-quote (production = "definition ล่าสุดชนะ" — chain มี
          #    CREATE POLICY ซ้ำโดยไม่มี DROP)
          preprocess() {
            local src="$1" dst="$2"
            sed -E \
              -e 's/^DO \} BEGIN$/DO $$ BEGIN/' \
              -e 's/^END \};$/END $$;/' \
              -e 's/^AS \}$/AS $$/' \
              -e 's/^\} SECURITY DEFINER;/$$ SECURITY DEFINER;/' \
              -e 's/\$\$_/\$\$/g' \
              -e 's/^={10,}BEGIN;/BEGIN;/' \
              -e "/sections=% still have null/ s/null\.';/null.', v_p, v_c, v_s;/" \
              -e "/addon_groups=% still have null/ s/null\.';/null.', v_ag, v_a, v_pag;/" \
              -e '/p_date\), 0 rdy$/ s/COUNT\(\*\) cnt FROM/COUNT(*) cnt, 0 rdy FROM/' \
              -e '/cnt, 0 rdy FROM/ s/, 0 rdy$//' \
              "$src" > "$dst"
            awk '
              BEGIN { inq=0 }
              {
                line=$0
                tmp=line; n=0
                while (match(tmp, /\$\$/)) { n++; tmp=substr(tmp, RSTART+RLENGTH) }
                if (n%2==1) inq=!inq
                if (!inq && line ~ /^[[:space:]]*CREATE POLICY[[:space:]]+/) {
                  t=line; sub(/^[[:space:]]*/,"",t); m=split(t,a,/[[:space:]]+/)
                  if (m>=5 && a[1]=="CREATE" && a[2]=="POLICY" && a[4]=="ON")
                    printf "DROP POLICY IF EXISTS %s ON %s;\n", a[3], a[5]
                }
                print line
              }
            ' "$dst" > "$dst.awk" && mv "$dst.awk" "$dst"
          }
          fail_count=0
          fail_sum=""
          # shim helper: รัน SQL เงียบ ๆ — ถ้า fail ต้อง emit annotation (ห้ามกลืน)
          shim() { # $1 = annotation path, $2 = sql
            local out rc
            out=$(psql -q -c "$2" 2>&1); rc=$?
            if [ $rc -ne 0 ]; then
              echo "::error file=$1::shim SQL failed: $out"
            fi
          }
          for f in supabase/migrations/*.sql; do
            b=$(basename "$f")
            case "$b" in PROPOSED_*|124_*) echo "== skip $b"; continue ;; esac
            if [ "$b" = "035_m1_closure_p0_blockers.sql" ]; then
              echo "== shims for 035 (documented CI-only; history file untouched)"
              shim "supabase/migrations/$b" "DROP FUNCTION IF EXISTS public.compute_delivery_fee(numeric,numeric,text,integer,numeric);"
              # PROVEN fresh-DB gap: ไม่มี migration 001-123 สร้าง orders.delivery_address
              # (001/003/004 มีเฉพาะ pre_orders) — production มีจาก manual-era drift
              shim "supabase/migrations/$b" "ALTER TABLE public.orders ADD COLUMN IF NOT EXISTS delivery_address TEXT DEFAULT '';"
            fi
            if [ "$b" = "037_m1_p0_blockers_repaired.sql" ]; then
              # 035 (temp-fixed) สร้าง compute_delivery_fee RETURNS jsonb แต่ 037 คืน
              # เป็น RETURNS numeric (ตัว repair) — CREATE OR REPLACE เปลี่ยน return
              # type ไม่ได้ → drop signature เดิม (args ตรงกัน) ก่อน replace
              echo "== shim 037: drop 035 jsonb compute_delivery_fee before numeric repair"
              shim "supabase/migrations/$b" "DROP FUNCTION IF EXISTS public.compute_delivery_fee(numeric,numeric,text,integer,numeric);"
            fi
            if [ "$b" = "065_rls_isolation.sql" ]; then
              # AUTHORING-ORDER DEFECT: 065 อ้าง profiles.tenant_id/is_platform แต่
              # คอลัมน์ถูกเพิ่มโดย 066 (ไฟล์ถัดไป) — pre-add IF NOT EXISTS (066 no-op)
              echo "== shim 065: pre-add profiles.tenant_id/is_platform (added by 066)"
              shim "supabase/migrations/$b" "ALTER TABLE public.profiles ADD COLUMN IF NOT EXISTS tenant_id TEXT; ALTER TABLE public.profiles ADD COLUMN IF NOT EXISTS is_platform BOOLEAN DEFAULT false;"
            fi
            if [ "$b" = "066_profiles_tenant_authority.sql" ]; then
              # 066 ตรวจสอบ is_platform=true ต้องมี 1 แถว — production มี profile owner
              # dddf4b57 (production identity evidence) แต่ DB ใหม่ไม่มี → seed
              echo "== shim 066: seed platform-owner profile fixture (dddf4b57)"
              shim "supabase/migrations/$b" "INSERT INTO auth.users (id, email, encrypted_password, created_at, updated_at, raw_app_meta_data, raw_user_meta_data, aud, role) VALUES ('dddf4b57-405f-4852-a985-76d8d52b1b72','fixture-owner@bmb.test','x',now(),now(),'{}','{}','authenticated','authenticated') ON CONFLICT (id) DO NOTHING; INSERT INTO public.profiles (id, role) VALUES ('dddf4b57-405f-4852-a985-76d8d52b1b72','admin') ON CONFLICT (id) DO NOTHING;"
            fi
            if [ "$b" = "081_branches_table.sql" ]; then
              # AUTHORING-ORDER DEFECT: 081 policy อ้าง profiles.branch_id แต่คอลัมน์
              # ถูกเพิ่มโดย 090 (ย้อนหลังไม่ได้) — pre-add IF NOT EXISTS (090 no-op)
              echo "== shim 081: pre-add profiles.branch_id (added by 090)"
              shim "supabase/migrations/$b" "ALTER TABLE public.profiles ADD COLUMN IF NOT EXISTS branch_id TEXT;"
            fi
            if [ "$b" = "107_product_backfill_scope_constraints.sql" ]; then
              # DATA PRECONDITION DEFECT: 107 กำหนด media_assets ต้องมี exactly 9 แถว
              # (production มี 9 แถวจริงจาก manual-era data migration — DB ใหม่ไม่มี)
              # → seed 9 fixture แถว (CI-only urls, category=product, asset_key ไม่ซ้ำ)
              # เพื่อให้ backfill+verify+CHECK constraints รันได้ครบ
              echo "== shim 107: seed 9 legacy media_assets fixture rows"
              shim "supabase/migrations/$b" "INSERT INTO public.media_assets (id, url, asset_key, category) VALUES ('fx-ma-1','https://example.invalid/legacy1.png','fx-key-1','product'),('fx-ma-2','https://example.invalid/legacy2.png','fx-key-2','product'),('fx-ma-3','https://example.invalid/legacy3.png','fx-key-3','product'),('fx-ma-4','https://example.invalid/legacy4.png','fx-key-4','product'),('fx-ma-5','https://example.invalid/legacy5.png','fx-key-5','product'),('fx-ma-6','https://example.invalid/legacy6.png','fx-key-6','product'),('fx-ma-7','https://example.invalid/legacy7.png','fx-key-7','product'),('fx-ma-8','https://example.invalid/legacy8.png','fx-key-8','product'),('fx-ma-9','https://example.invalid/legacy9.png','fx-key-9','product') ON CONFLICT (id) DO NOTHING;"
            fi
            tmp=$(mktemp)
            preprocess "$f" "$tmp"
            echo "== apply $b"
            out=$(psql -v ON_ERROR_STOP=1 -q -f "$tmp" 2>&1); rc=$?
            rm -f "$tmp"
            printf '%s\n' "$out"
            if [ $rc -ne 0 ]; then
              fail_count=$((fail_count+1))
              fail_sum="$fail_sum $b"
              msg=$(printf '%s\n' "$out" | grep -m1 'ERROR:' || echo "failed rc=$rc")
              ln=$(printf '%s\n' "$out" | grep -m1 -oE ':[0-9]+: ERROR' | grep -oE '[0-9]+' | head -1 || true)
              echo "::error file=supabase/migrations/$b,line=${ln:-1}::$msg"
            fi
          done
          if [ $fail_count -gt 0 ]; then
            echo "::error::Migration inventory: $fail_count file(s) failed:$fail_sum"
            exit 1
          fi
          echo "All migrations 001-123 applied cleanly on isolated DB"

      - name: Contract 123 — menu publish enforcement (transaction ROLLBACK)
        run: psql -v ON_ERROR_STOP=1 -f e2e/contracts_123_menu_publish.sql

      - name: Apply migration 124 — idempotency (isolated only, NOT production)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/124_order_submit_idempotency.sql

      - name: Contract 124 — idempotency matrix (transaction ROLLBACK)
        run: psql -v ON_ERROR_STOP=1 -f e2e/contracts_124_idempotency.sql

      - name: Verify contracts left zero persisted test data
        run: |
          set -euo pipefail
          test "$(psql -Atc 'SELECT count(*) FROM public.order_submissions')" = "0"
          test "$(psql -Atc "SELECT count(*) FROM public.orders WHERE customer_phone IN ('0900000000','0999999999')")" = "0"
          echo "cleanup OK — no persisted contract data"

      - name: Concurrency — two sessions, same key (ephemeral leftovers OK)
        run: bash e2e/ci/concurrency_124.sh