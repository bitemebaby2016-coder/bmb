# ISOLATED SQL contract tests — ephemeral PostgreSQL service (CI only).
# แยกจาก ci.yml (production build path) อย่างเด็ดขาด: ไม่มี production
# credentials, ไม่มี supabase URL fallback, DB หายไปพร้อม job ทุกครั้ง
name: Contract Tests (isolated PostgreSQL)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sql-contracts:
    name: Migrations + SQL contracts (ephemeral PG)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bmb_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bmb_contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Prelude — Supabase stubs (roles/auth/storage)
        run: psql -v ON_ERROR_STOP=1 -f e2e/ci/00_prelude_supabase_stubs.sql

      - name: Apply migrations 001-123 (inventory mode — collect ALL failures)
        run: |
          set -uo pipefail
          # preprocessor: แก้เฉพาะ TEMP COPY (ไฟล์ history ไม่ถูกแตะ)
          # 1) '}' ที่ใช้แทน dollar-quote ใน 035 (4 บรรทัด, manual-apply era)
          # 2) แทรก DROP POLICY IF EXISTS ก่อนทุก CREATE POLICY (production =
          #    "definition ล่าสุดชนะ" — chain มี CREATE POLICY ซ้ำ ≥34 จุดโดยไม่มี DROP)
          preprocess() {
            local src="$1" dst="$2"
            sed -E \
              -e 's/^DO \} BEGIN$/DO $$ BEGIN/' \
              -e 's/^END \};$/END $$;/' \
              -e 's/^AS \}$/AS $$/' \
              -e 's/^\} SECURITY DEFINER;/$$ SECURITY DEFINER;/' \
              "$src" > "$dst"
            awk '
              BEGIN { inq=0 }
              {
                line=$0
                if (line ~ /\$\$/) { n=gsub(/\$\$/,"&&"); if (n%2==1) inq=!inq }
                if (!inq && line ~ /^[[:space:]]*CREATE POLICY[[:space:]]+/) {
                  t=line; sub(/^[[:space:]]*/,"",t); m=split(t,a,/[[:space:]]+/)
                  if (m>=4 && a[3]=="ON") printf "DROP POLICY IF EXISTS %s ON %s;\n", a[2], a[4]
                }
                print
              }
            ' "$dst" > "$dst.awk" && mv "$dst.awk" "$dst"
          }
          fail_count=0
          fail_sum=""
          for f in supabase/migrations/*.sql; do
            b=$(basename "$f")
            case "$b" in PROPOSED_*|124_*) echo "== skip $b"; continue ;; esac
            if [ "$b" = "035_m1_closure_p0_blockers.sql" ]; then
              echo "== shims for 035 (documented CI-only; history file untouched)"
              psql -q -c "DROP FUNCTION IF EXISTS public.compute_delivery_fee(numeric,numeric,text,integer,numeric);" || true
              # PROVEN fresh-DB gap: ไม่มี migration 001-123 สร้าง orders.delivery_address
              # (001/003/004 มีเฉพาะ pre_orders) — production มีจาก manual-era drift
              psql -q -c "ALTER TABLE public.orders ADD COLUMN IF NOT EXISTS delivery_address TEXT DEFAULT '';" || true
            fi
            tmp=$(mktemp)
            preprocess "$f" "$tmp"
            echo "== apply $b"
            out=$(psql -v ON_ERROR_STOP=1 -q -f "$tmp" 2>&1); rc=$?
            rm -f "$tmp"
            printf '%s\n' "$out"
            if [ $rc -ne 0 ]; then
              fail_count=$((fail_count+1))
              fail_sum="$fail_sum $b"
              msg=$(printf '%s\n' "$out" | grep -m1 'ERROR:' || echo "failed rc=$rc")
              ln=$(printf '%s\n' "$out" | grep -m1 -oE ':[0-9]+: ERROR' | grep -oE '[0-9]+' | head -1 || true)
              echo "::error file=supabase/migrations/$b,line=${ln:-1}::$msg"
            fi
          done
          if [ $fail_count -gt 0 ]; then
            echo "::error::Migration inventory: $fail_count file(s) failed:$fail_sum"
            exit 1
          fi
          echo "All migrations 001-123 applied cleanly on isolated DB"

      - name: Contract 123 — menu publish enforcement (transaction ROLLBACK)
        run: psql -v ON_ERROR_STOP=1 -f e2e/contracts_123_menu_publish.sql

      - name: Apply migration 124 — idempotency (isolated only, NOT production)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/124_order_submit_idempotency.sql

      - name: Contract 124 — idempotency matrix (transaction ROLLBACK)
        run: psql -v ON_ERROR_STOP=1 -f e2e/contracts_124_idempotency.sql

      - name: Verify contracts left zero persisted test data
        run: |
          set -euo pipefail
          test "$(psql -Atc 'SELECT count(*) FROM public.order_submissions')" = "0"
          test "$(psql -Atc "SELECT count(*) FROM public.orders WHERE customer_phone IN ('0900000000','0999999999')")" = "0"
          echo "cleanup OK — no persisted contract data"

      - name: Concurrency — two sessions, same key (ephemeral leftovers OK)
        run: bash e2e/ci/concurrency_124.sh