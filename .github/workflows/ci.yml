# ============================================
# Bite Me Baby — CI (QA-01) — runs on every push / PR
# test + lint + build must pass for Domain A closure.
# ============================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 engines: ^22.22.2 || ^24.15.0 || >=26.0.0 — Node 20 breaks
          # the vitest jsdom environment (CI runs #3-#14 all red for this reason)
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-key-not-a-secret

      - name: Typecheck + Build (PWA)
        run: npm run build