# ============================================
# Bite Me Baby — CI (QA-01) — runs on every push / PR
# test + lint + build must pass for Domain A closure.
# ============================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Test + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck + Build (PWA)
        run: npm run build