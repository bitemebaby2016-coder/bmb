# ============================================
# BMB — daily-backup (BACKEND-CAPABILITY-CLOSURE-2026-10-19)
# Refactored 2026-10-19: GCS → Supabase Storage (GCP Organization Policy
# "Secure by Default" บล็อกการสร้าง service-account key JSON — ระบบจึงไม่
# พึ่งพา GCP credentials อีกต่อไป)
#
# Daily PostgreSQL logical backup -> Supabase Storage PRIVATE bucket `db-backups`
# (service-role key auth, Storage REST API).
#
# Trigger: 07:30 Asia/Bangkok daily (cron '30 0 * * *' UTC) + manual dispatch.
# Integrity (fail closed): scripts/dbBackup.mjs วัด size + sha256 ก่อน upload,
#   ดาวน์โหลดกลับมาเทียบ byte-for-byte หลัง upload, แล้ว step --verify ซ้ำอีกชั้น
#   (manifest hash + มีไฟล์ .sql.gz ใน bucket + bucket ยังเป็น private).
# Retention: 30 daily / 12 monthly (first-of-month) — enforced in-script.
# Failure behavior: job FAILS loudly (GitHub notification + ::error) — Owner
#   must see missed backups. Optional LINE alert if LINE_NOTIFY_TOKEN is set.
#
# REQUIRED REPO SECRETS (Owner action — never committed):
#   SUPABASE_SERVICE_ROLE_KEY = Supabase service_role key (storage R/W on bucket)
#   BMB_DATABASE_URL          = Supabase pooler connection string (pg_dump)
# Optional:
#   LINE_NOTIFY_TOKEN         = LINE notify token for failure alerts
# (GCS_SERVICE_ACCOUNT_JSON ถูกลบออกจากการใช้งานแล้ว — ลบ secret เดิมทิ้งได้)
# ============================================

name: daily-backup

on:
  schedule:
    - cron: '30 0 * * *'   # 07:30 Asia/Bangkok
  workflow_dispatch:
    inputs:
      mode:
        description: 'backup | verify'
        required: false
        default: 'backup'

concurrency:
  group: bmb-daily-backup
  cancel-in-progress: false

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://ivkdfognyiwjcmrhcnwz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BACKUP_BUCKET: db-backups
      BMB_DATABASE_URL: ${{ secrets.BMB_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pg_dump client major MUST be >= server major (Supabase = PostgreSQL 17.6)
      - name: Install pg_dump 17 (PGDG)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Daily dump + upload + integrity verify
        if: github.event.inputs.mode != 'verify'
        run: node scripts/dbBackup.mjs

      - name: Post-backup verify (manifest hashes + .sql.gz presence + private bucket)
        if: github.event.inputs.mode != 'verify'
        run: node scripts/dbBackup.mjs --verify

      - name: Verify only (no dump)
        if: github.event.inputs.mode == 'verify'
        run: node scripts/dbBackup.mjs --verify

      - name: Alert on failure (optional LINE)
        if: failure()
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: |
          echo "::error::daily-backup FAILED — สำรองข้อมูลไม่สำเร็จ ตรวจสอบ Actions log ทันที"
          if [ -n "$LINE_NOTIFY_TOKEN" ]; then
            curl -sS -X POST https://notify-api.line.me/api/notify \
              -H "Authorization: Bearer $LINE_NOTIFY_TOKEN" \
              --data-urlencode "message=[BMB] daily-backup FAILED (${GITHUB_RUN_ID}) — ต้องตรวจสอบทันที" || true
          fi