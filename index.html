<!doctype html>
<html lang="th" xml:lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF5E1E" />
    <meta name="robots" content="index, follow" />
<!-- Meta Domain Verification (facebook-domain-verification) -->
    <meta name="facebook-domain-verification" content="hb1g366z66y96vsxzmmyarkqk6a2ef" />

    <!-- Apply saved theme BEFORE first paint (กันกระพริบธีม — legacy 'orange'/'gray' -> light/dark) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bmb-theme');
          var dark = (t === 'dark' || t === 'gray');
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = dark ? '#121214' : '#FF5E1E';
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>

    <!-- Primary SEO — static tags are Helmet-OWNED (data-react-helmet) so the
         per-page SeoHelmet REPLACES them instead of duplicating them; they still
         serve as fallback on routes with no SEO route entry. -->
    <title data-react-helmet="true">Bite Me Baby - สั่งอาหารจัดส่งเมืองจันทบุรี รัศมี 5 กม.</title>
    <meta data-react-helmet="true" name="description" content="Bite Me Baby - ร้านอาหารไทยจัดส่งถึงบ้านในรัศมี 5 กม. จากตัวเมืองจันทบุรี จัดส่งเช้า กลางวัน เย็น สั่งออนไลน์ได้พร้อม AI Assistant 24/7" />
    <meta data-react-helmet="true" name="keywords" content="สั่งอาหารจันทบุรี, อาหารจัดส่ง, ร้านอาหารเมืองจันทบุรี, Bite Me Baby, ส่งอาหารจันทบุรี, cloud kitchen จันทบุรี" />

    <!-- Canonical + hreflang (TH/EN) -->
    <link data-react-helmet="true" rel="canonical" href="https://biteme-baby.com/" />
    <link data-react-helmet="true" rel="alternate" hreflang="th" href="https://biteme-baby.com/" />
    <link data-react-helmet="true" rel="alternate" hreflang="en" href="https://biteme-baby.com/?lang=en" />
    <link data-react-helmet="true" rel="alternate" hreflang="x-default" href="https://biteme-baby.com/" />

    <!-- Open Graph -->
    <meta data-react-helmet="true" property="og:title" content="Bite Me Baby - สั่งอาหารจัดส่งเมืองจันทบุรี" />
    <meta data-react-helmet="true" property="og:description" content="ร้านอาหารไทยจัดส่งถึงบ้าน รัศมี 5 กม. จากตัวเมืองจันทบุรี สั่งออนไลน์ได้เลย" />
    <meta data-react-helmet="true" property="og:type" content="website" />
    <meta data-react-helmet="true" property="og:image" content="https://biteme-baby.com/og-image.png" />
    <meta data-react-helmet="true" property="og:url" content="https://biteme-baby.com/" />
    <meta data-react-helmet="true" property="og:site_name" content="Bite Me Baby" />
    <meta data-react-helmet="true" property="og:locale" content="th_TH" />
    <meta data-react-helmet="true" property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta data-react-helmet="true" name="twitter:card" content="summary_large_image" />
    <meta data-react-helmet="true" name="twitter:title" content="Bite Me Baby" />
    <meta data-react-helmet="true" name="twitter:description" content="สั่งอาหารจัดส่งเมืองจันทบุรี รัศมี 5 กม." />

    <!-- GEO (Local SEO) -->
    <meta name="geo.region" content="TH-22" />
    <meta name="geo.placename" content="Chanthaburi" />
    <meta name="geo.position" content="10.7016;102.1429" />
    <meta name="ICBM" content="10.7016, 102.1429" />

    <!-- JSON-LD lives ONLY in SeoHelmet (src/lib/seo.ts) — a static copy here
         duplicated the schema on every page and carried a placeholder phone. -->

<!-- Self-hosted fonts (Nunito + Quicksand) — no render-blocking third-party request -->
    <link rel="preload" href="/fonts/nunito-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-700-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/quicksand-700-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- PWA facade -->
    <!-- name="description" already set above for the landing page -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
