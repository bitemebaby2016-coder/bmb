<!doctype html>
<html lang="th" xml:lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF5E1E" />
    <meta name="robots" content="index, follow" />
<!-- Meta Domain Verification (facebook-domain-verification) -->
    <meta name="facebook-domain-verification" content="hb1g366z66y96vsxzmmyarkqk6a2ef" />

    <!-- Apply saved theme BEFORE first paint (กันกระพริบธีม — legacy 'orange'/'gray' -> light/dark) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bmb-theme');
          var theme = (t === 'dark' || t === 'gray') ? 'dark' : (t === 'graphite' ? 'graphite' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = theme === 'light' ? '#FF5E1E' : theme === 'graphite' ? '#1B1B20' : '#121214';
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>

    <!-- No static SEO tags here on purpose: React 19 natively HOISTS the
         <title>/<meta>/<link> rendered by SeoHelmet (src/lib/seo.ts) into <head>.
         A static copy used to shadow every page — verified live: two <title>,
         two canonicals, two og:url per URL, document.title stuck on the home
         title. Routes without an SEO entry in App.tsx currently render no
         per-page meta; tracked in the launch checklist. -->

    <!-- GEO (Local SEO) -->
    <meta name="geo.region" content="TH-22" />
    <meta name="geo.placename" content="Chanthaburi" />
    <meta name="geo.position" content="10.7016;102.1429" />
    <meta name="ICBM" content="10.7016, 102.1429" />

    <!-- JSON-LD lives ONLY in SeoHelmet (src/lib/seo.ts) — a static copy here
         duplicated the schema on every page and carried a placeholder phone. -->

<!-- Self-hosted fonts (Nunito + Quicksand) — no render-blocking third-party request -->
    <link rel="preload" href="/fonts/nunito-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-700-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/quicksand-700-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- PWA facade -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
