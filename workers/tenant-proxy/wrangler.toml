name = "bmb-tenant-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# บังคับ target account = บัญชีที่ "มี zone biteme-baby.com" + "token เข้าถึง Workers ได้" (พิสูจน์แล้วใน e2e/r22_cf_probe2.cjs:
#   V4_ZONE→account=b89501b69eef20998a9d3dae480c52af · V4_B895_WORKERS=200 · V4_0341_WORKERS=403)
# ถ้า deploy ยัง error 10000 อีก = wrangler ยังถูก oauth เก่า (บัญชี 0341... ค้างใน %USERPROFILE%\.wrangler\config\default.toml)
#   → แก้: `npx wrangler logout` (หรือ rename default.toml → .bak) แล้วรัน e2e\r22_deploy_worker.cmd ใหม่
account_id = "b89501b69eef20998a9d3dae480c52af"

# ============================================
# Task 2 · Custom Domain Routing (Cloudflare Worker = Reverse Proxy)
# หน้าที่: รับ request จากโดเมนลูกค้า (order.bakerybrand.com) → lookup tenant
# จาก tenants.custom_domain (Supabase REST) → ส่งต่อไป PWA เดิม (Pages origin)
# พร้อม header X-BMB-Tenant-* ให้ฝั่งแอป resolve ธีม/ร้าน (src/lib/hostnameTenant.ts)
# deploy = Owner: wrangler deploy (ยังไม่ deploy ในรอบนี้ — บันทึกใน changelog)
# ============================================

[vars]
# Pages origin หลักของ BMB (ทุกร้านวิ่ง PWA เดียวกัน · ต่างกันที่ tenant context)
ORIGIN = "https://biteme-baby.com"
# ค่าเริ่มต้นเมื่อ lookup ไม่เจอ = ร้านหลัก (ไม่เดาเป็นร้านอื่น)
DEFAULT_TENANT_ID = "tenant-bmb-001"